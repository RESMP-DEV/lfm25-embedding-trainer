[project]
name = "lfm25-embedding-trainer"
version = "0.4.0"
description = "Fine-tune LiquidAI LFM2.5 Embedding models on your own retrieval pairs"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [{ name = "RESMP.DEV contributors" }]
keywords = ["embeddings", "retrieval", "contrastive-learning", "lfm2", "lfm2.5"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0",
  "typer>=0.15",
]

[project.optional-dependencies]
train = [
  "optuna>=4,<5",
  "sentence-transformers>=5.1,<6",
  "torch>=2.5",
  "transformers>=5.5,<6",
  "wandb>=0.19,<1",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
  "ty>=0.0.1a16",
]

[project.scripts]
lfm25-embed = "lfm25_embedding_trainer.cli:app"

[project.urls]
Repository = "https://github.com/RESMP-DEV/lfm25-embedding-trainer"
Documentation = "https://github.com/RESMP-DEV/lfm25-embedding-trainer#readme"
Issues = "https://github.com/RESMP-DEV/lfm25-embedding-trainer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfm25_embedding_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
